name: Refresh profile content

on:
  schedule:
    - cron: "12 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/update_profile.py"
      - ".github/workflows/update-profile-content.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh project showcase and recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: aruncx
        run: python .github/scripts/update_profile.py

      - name: Commit updated profile sections
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub profile content"
          file_pattern: README.md
